name: Build Extreme Message Animator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE and Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build standalone EXE
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ExtremeMessageAnimator
          app.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\ExtremeMessageAnimator.exe")) {
            Write-Error "EXE was not created."
            exit 1
          }

          $size = (Get-Item "dist\ExtremeMessageAnimator.exe").Length

          Write-Host "EXE created successfully."
          Write-Host "Size: $size bytes"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer.iss"

          if (!(Test-Path "installer\ExtremeMessageAnimator-Setup.exe")) {
            Write-Error "Installer was not created."
            exit 1
          }

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v5
        with:
          name: ExtremeMessageAnimator-Windows-EXE
          path: dist/ExtremeMessageAnimator.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: ExtremeMessageAnimator-Windows-Installer
          path: installer/ExtremeMessageAnimator-Setup.exe
          if-no-files-found: error

name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --windowed ^
            --name ExtremeMessageAnimator ^
            app.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build Installer
        run: |
          iscc installer.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: ExtremeMessageAnimator-EXE
          path: dist/ExtremeMessageAnimator.exe

      - name: Upload Installer
        uses: actions/upload-artifact@v5
        with:
          name: ExtremeMessageAnimator-Installer
          path: installer/ExtremeMessageAnimator-Setup.exe

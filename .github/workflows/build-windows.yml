name: Build Windows 7 and 10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    name: Legacy Windows Build

    runs-on: windows-2022

    steps:

      # --------------------------------------------------
      # SOURCE
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PYTHON 3.8
      # --------------------------------------------------

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      # --------------------------------------------------
      # VERIFY PYTHON
      # --------------------------------------------------

      - name: Show Python version
        shell: cmd
        run: |
          python --version
          python -c "import sys; print(sys.version)"

      # --------------------------------------------------
      # INSTALL
      # --------------------------------------------------

      - name: Upgrade pip
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24.1"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install pygame==2.1.3
          python -m pip install pyinstaller==5.13.2

      # --------------------------------------------------
      # VERIFY PYGAME
      # --------------------------------------------------

      - name: Test pygame
        shell: cmd
        run: |
          python -c "import pygame; print('pygame:', pygame.version.ver)"

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build application
        shell: cmd
        run: |
          rmdir /s /q build 2>nul || exit /b 0
          rmdir /s /q dist 2>nul || exit /b 0

          pyinstaller ^
            --clean ^
            --noconfirm ^
            ExtremeMessageAnimator.spec

      # --------------------------------------------------
      # VERIFY
      # --------------------------------------------------

      - name: Verify EXE
        shell: powershell
        run: |

          $exe = "dist\ExtremeMessageAnimator.exe"

          if (!(Test-Path $exe)) {
              Write-Error "ExtremeMessageAnimator.exe was not created."
              exit 1
          }

          $file = Get-Item $exe

          Write-Host "--------------------------------------"
          Write-Host "BUILD SUCCESS"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "--------------------------------------"

      # --------------------------------------------------
      # CREATE INSTALLER DIRECTORY
      # --------------------------------------------------

      - name: Create installer directory
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path installer

      # --------------------------------------------------
      # INSTALL LEGACY INNO SETUP
      # --------------------------------------------------

      - name: Install Inno Setup
        shell: powershell
        run: |

          choco install innosetup `
            --version=6.2.2 `
            --no-progress `
            -y

      # --------------------------------------------------
      # BUILD INSTALLER
      # --------------------------------------------------

      - name: Build installer
        shell: powershell
        run: |

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
              Write-Error "Inno Setup compiler was not found."
              exit 1
          }

          & $iscc "installer.iss"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Inno Setup failed."
              exit 1
          }

      # --------------------------------------------------
      # VERIFY INSTALLER
      # --------------------------------------------------

      - name: Verify installer
        shell: powershell
        run: |

          $installer = `
            "installer\ExtremeMessageAnimator-Windows7-10-Setup.exe"

          if (!(Test-Path $installer)) {
              Write-Error "Installer was not created."
              exit 1
          }

          $file = Get-Item $installer

          Write-Host "--------------------------------------"
          Write-Host "INSTALLER SUCCESS"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "--------------------------------------"

      # --------------------------------------------------
      # UPLOAD EXE
      # --------------------------------------------------

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeMessageAnimator-Windows7-10-EXE
          path: dist/ExtremeMessageAnimator.exe
          if-no-files-found: error

      # --------------------------------------------------
      # UPLOAD INSTALLER
      # --------------------------------------------------

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeMessageAnimator-Windows7-10-Installer
          path: installer/ExtremeMessageAnimator-Windows7-10-Setup.exe
          if-no-files-found: error

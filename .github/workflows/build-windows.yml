name: Build Extreme Message Animator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows 7/10 EXE and Installer
    runs-on: windows-2022

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON 3.8.10
      # ============================================================
      - name: Setup Python 3.8.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip

      # ============================================================
      # SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILD ENVIRONMENT"
          Write-Host "=========================================="

          python --version
          python -c "import platform; print('Platform:', platform.platform()); print('Machine:', platform.machine())"

          Write-Host ""
          Write-Host "Python:"
          where.exe python

          Write-Host ""
          Write-Host "Python location:"
          Write-Host $env:pythonLocation

      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================
      - name: Install Python dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLING PYTHON DEPENDENCIES"
          Write-Host "=========================================="

          python -m pip install --upgrade "pip<24.1"

          python -m pip install `
            --no-cache-dir `
            pygame==2.1.3

          python -m pip install `
            --no-cache-dir `
            pyinstaller==5.13.2

      # ============================================================
      # VERIFY PYGAME
      # ============================================================
      - name: Verify Pygame
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING PYGAME"
          Write-Host "=========================================="

          python -c "import pygame; print('Pygame version:', pygame.version.ver)"

          python -c "import pygame; pygame.init(); print('Pygame initialized successfully'); pygame.quit()"

      # ============================================================
      # VERIFY PYINSTALLER
      # ============================================================
      - name: Verify PyInstaller
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING PYINSTALLER"
          Write-Host "=========================================="

          python -m PyInstaller --version

      # ============================================================
      # VERIFY SOURCE FILES
      # ============================================================
      - name: Verify project files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "app.py",
            "requirements.txt",
            "ExtremeMessageAnimator.spec",
            "installer.iss"
          )

          foreach ($file in $requiredFiles) {

            if (-not (Test-Path $file)) {
              throw "Required file not found: $file"
            }

            Write-Host "FOUND: $file"
          }

          Write-Host ""
          Write-Host "All required project files found."

      # ============================================================
      # CLEAN BUILD DIRECTORIES
      # ============================================================
      - name: Clean build directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CLEANING BUILD DIRECTORIES"
          Write-Host "=========================================="

          $folders = @(
            "build",
            "dist",
            "installer",
            "portable",
            "Output"
          )

          foreach ($folder in $folders) {

            if (Test-Path $folder) {
              Remove-Item `
                $folder `
                -Recurse `
                -Force

              Write-Host "Removed: $folder"
            }
          }

          Write-Host "Cleaning complete."

      # ============================================================
      # BUILD APPLICATION
      # ============================================================
      - name: Build application with PyInstaller
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING APPLICATION"
          Write-Host "=========================================="

          python -m PyInstaller `
            --clean `
            --noconfirm `
            "ExtremeMessageAnimator.spec"

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller build failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "PyInstaller build completed."

      # ============================================================
      # VERIFY APPLICATION EXE
      # ============================================================
      - name: Verify application EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "dist\ExtremeMessageAnimator.exe"

          Write-Host "=========================================="
          Write-Host "VERIFYING APPLICATION EXE"
          Write-Host "=========================================="

          if (-not (Test-Path $exe)) {
            throw "ExtremeMessageAnimator.exe was not created."
          }

          $file = Get-Item $exe

          Write-Host "EXE:"
          Write-Host $file.FullName

          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"

          if ($file.Length -lt 1000000) {
            Write-Warning "The EXE is unusually small."
          }

          Write-Host ""
          Write-Host "Application EXE verified successfully."

      # ============================================================
      # ADD WINDOWS RUNTIME DLLS
      # ============================================================
      - name: Add Windows runtime DLLs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ADDING WINDOWS RUNTIME DLLS"
          Write-Host "=========================================="

          $dist = Join-Path $PWD "dist"

          if (-not (Test-Path $dist)) {
            throw "dist directory does not exist."
          }

          # --------------------------------------------------------
          # Visual C++ Runtime DLLs
          # --------------------------------------------------------

          $pythonRoot = $env:pythonLocation

          $runtimeFiles = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($file in $runtimeFiles) {

            $source = Join-Path $pythonRoot $file
            $destination = Join-Path $dist $file

            if (Test-Path $source) {

              Copy-Item `
                $source `
                $destination `
                -Force

              Write-Host "Copied: $file"
            }
            else {
              Write-Warning "Not found: $source"
            }
          }

          # --------------------------------------------------------
          # Universal CRT
          # --------------------------------------------------------

          $ucrtCandidates = @()

          $windowsKitRoots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Redist",
            "${env:ProgramFiles}\Windows Kits\10\Redist"
          )

          foreach ($root in $windowsKitRoots) {

            if (Test-Path $root) {

              Write-Host "Searching:"
              Write-Host $root

              $found = Get-ChildItem `
                -Path $root `
                -Filter "ucrtbase.dll" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue

              if ($found) {
                $ucrtCandidates += $found
              }
            }
          }

          $ucrt = $ucrtCandidates |
            Where-Object {
              $_.FullName -match "x64"
            } |
            Select-Object -First 1

          if (-not $ucrt) {
            $ucrt = $ucrtCandidates |
              Select-Object -First 1
          }

          if ($ucrt) {

            Copy-Item `
              $ucrt.FullName `
              (Join-Path $dist "ucrtbase.dll") `
              -Force

            Write-Host ""
            Write-Host "Copied ucrtbase.dll:"
            Write-Host $ucrt.FullName
          }
          else {
            Write-Warning "ucrtbase.dll was not found."
          }

          Write-Host ""
          Write-Host "Runtime DLLs currently in dist:"

          Get-ChildItem $dist |
            Where-Object {
              $_.Name -match "^(ucrtbase|vcruntime).*\.dll$"
            } |
            Select-Object Name, Length

      # ============================================================
      # VERIFY WINDOWS RUNTIME DLLS
      # ============================================================
      - name: Verify Windows runtime files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING WINDOWS RUNTIME FILES"
          Write-Host "=========================================="

          $dist = "dist"

          if (-not (Test-Path "$dist\ExtremeMessageAnimator.exe")) {
            throw "Application EXE is missing."
          }

          $runtimeFiles = @(
            "ucrtbase.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($file in $runtimeFiles) {

            $path = Join-Path $dist $file

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "FOUND: $file ($size bytes)"
            }
            else {
              Write-Warning "NOT FOUND: $file"
            }
          }

      # ============================================================
      # LOCATE PREINSTALLED INNO SETUP
      #
      # DO NOT INSTALL / DOWNGRADE INNO SETUP.
      # GitHub runner already contains Inno Setup 6.
      # ============================================================
      - name: Locate Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "LOCATING INNO SETUP"
          Write-Host "=========================================="

          $possiblePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          $iscc = $null

          foreach ($path in $possiblePaths) {

            if (Test-Path $path) {
              $iscc = $path
              break
            }
          }

          # --------------------------------------------------------
          # Fallback search
          # --------------------------------------------------------

          if (-not $iscc) {

            Write-Host "Standard location not found."
            Write-Host "Searching Program Files..."

            $searchRoots = @(
              $env:ProgramFiles,
              ${env:ProgramFiles(x86)}
            )

            foreach ($root in $searchRoots) {

              if (-not $root) {
                continue
              }

              if (-not (Test-Path $root)) {
                continue
              }

              $found = Get-ChildItem `
                -Path $root `
                -Filter "ISCC.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $iscc = $found.FullName
                break
              }
            }
          }

          if (-not $iscc) {
            throw "Inno Setup ISCC.exe was not found."
          }

          Write-Host ""
          Write-Host "Inno Setup found:"
          Write-Host $iscc

          # Make available to later workflow steps.
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      # ============================================================
      # VERIFY INNO SETUP
      #
      # IMPORTANT:
      # DO NOT RUN "ISCC.EXE /?"
      #
      # ISCC displays help but returns exit code 1 for /?.
      # ============================================================
      - name: Verify Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ISCC_PATH) {
            throw "ISCC_PATH is not defined."
          }

          if (-not (Test-Path $env:ISCC_PATH)) {
            throw "ISCC.exe does not exist at $env:ISCC_PATH"
          }

          Write-Host "=========================================="
          Write-Host "INNO SETUP FOUND"
          Write-Host "=========================================="

          Write-Host "Path:"
          Write-Host $env:ISCC_PATH

          $version = (Get-Item $env:ISCC_PATH).VersionInfo.ProductVersion

          Write-Host ""
          Write-Host "Version:"
          Write-Host $version

          Write-Host ""
          Write-Host "Inno Setup verification successful."

      # ============================================================
      # BUILD INSTALLER
      # ============================================================
      - name: Build Installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING WINDOWS INSTALLER"
          Write-Host "=========================================="

          if (-not $env:ISCC_PATH) {
            throw "ISCC_PATH is not available."
          }

          if (-not (Test-Path $env:ISCC_PATH)) {
            throw "ISCC.exe was not found at $env:ISCC_PATH"
          }

          if (-not (Test-Path "installer.iss")) {
            throw "installer.iss was not found."
          }

          Write-Host "Compiler:"
          Write-Host $env:ISCC_PATH

          Write-Host ""
          Write-Host "Installer script:"
          Write-Host "$PWD\installer.iss"

          Write-Host ""
          Write-Host "Starting Inno Setup compilation..."

          & $env:ISCC_PATH "installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INNO SETUP BUILD SUCCESSFUL"
          Write-Host "=========================================="

      # ============================================================
      # FIND AND VERIFY INSTALLER
      # ============================================================
      - name: Verify installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING INSTALLER"
          Write-Host "=========================================="

          $installerFiles = Get-ChildItem `
            -Path $PWD `
            -Filter "*.exe" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch "\\dist\\" `
              -and $_.FullName -match "Setup"
            } |
            Sort-Object LastWriteTime -Descending

          $installer = $installerFiles | Select-Object -First 1

          if (-not $installer) {
            throw "Installer EXE was not created."
          }

          Write-Host "Installer found:"
          Write-Host $installer.FullName

          Write-Host ""
          Write-Host "Installer size:"
          Write-Host "$($installer.Length) bytes"

          if ($installer.Length -lt 1000000) {
            Write-Warning "Installer is unusually small."
          }

          # --------------------------------------------------------
          # Create predictable installer directory
          # --------------------------------------------------------

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "installer" |
            Out-Null

          $finalInstaller = "installer\ExtremeMessageAnimator-Windows7-10-Setup.exe"

          Copy-Item `
            $installer.FullName `
            $finalInstaller `
            -Force

          if (-not (Test-Path $finalInstaller)) {
            throw "Final installer copy failed."
          }

          Write-Host ""
          Write-Host "Final installer:"
          Write-Host "$PWD\$finalInstaller"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INSTALLER VERIFIED"
          Write-Host "=========================================="

      # ============================================================
      # CREATE PORTABLE PACKAGE
      # ============================================================
      - name: Create portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE PACKAGE"
          Write-Host "=========================================="

          if (-not (Test-Path "dist\ExtremeMessageAnimator.exe")) {
            throw "Portable EXE is missing."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "portable" |
            Out-Null

          Copy-Item `
            "dist\ExtremeMessageAnimator.exe" `
            "portable\ExtremeMessageAnimator.exe" `
            -Force

          $dlls = @(
            "ucrtbase.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($dll in $dlls) {

            $source = "dist\$dll"

            if (Test-Path $source) {

              Copy-Item `
                $source `
                "portable\$dll" `
                -Force

              Write-Host "Copied: $dll"
            }
          }

          Write-Host ""
          Write-Host "Portable package contents:"
          Get-ChildItem "portable"

      # ============================================================
      # UPLOAD PORTABLE PACKAGE
      # ============================================================
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeMessageAnimator-Portable-Windows7-10
          path: portable/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD INSTALLER
      # ============================================================
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeMessageAnimator-Setup-Windows7-10
          path: installer/ExtremeMessageAnimator-Windows7-10-Setup.exe
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # FINAL SUMMARY
      # ============================================================
      - name: Build summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "           BUILD COMPLETED SUCCESSFULLY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Portable:"
          Write-Host "  ExtremeMessageAnimator-Portable-Windows7-10"
          Write-Host ""
          Write-Host "Installer:"
          Write-Host "  ExtremeMessageAnimator-Setup-Windows7-10"
          Write-Host ""
          Write-Host "The GitHub Actions artifacts are ready."
          Write-Host "=================================================="
